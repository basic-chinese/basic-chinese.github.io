<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>기초생활중국어 연습</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+SC:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#edf2f1; --card:#fbfdfc; --ink:#14302b; --muted:#5d746f; --line:#d3e0dc;
  --blue:#1f4e9c; --blue-soft:#e3ebf8; --ok:#1c7f55; --ok-soft:#dff2e8; --warn:#9a5b00; --warn-soft:#fbefd6;
  --bad:#b3372c; --grid:#b9cdc8;
  --sans:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --hanzi:"Noto Serif SC","Songti SC","Noto Serif CJK SC","SimSun",serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1620; --card:#16222f; --ink:#e6f0ee; --muted:#9bb2ad; --line:#2a3b4a;
    --blue:#8fb0ff; --blue-soft:#1e2e4d; --ok:#5cc48f; --ok-soft:#163528; --warn:#e8b25a; --warn-soft:#3a2e14;
    --bad:#ff8a7c; --grid:#38505a;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1620; --card:#16222f; --ink:#e6f0ee; --muted:#9bb2ad; --line:#2a3b4a;
  --blue:#8fb0ff; --blue-soft:#1e2e4d; --ok:#5cc48f; --ok-soft:#163528; --warn:#e8b25a; --warn-soft:#3a2e14;
  --bad:#ff8a7c; --grid:#38505a;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;padding-bottom:84px;-webkit-text-size-adjust:100%}
button{font-family:inherit;font-size:15px;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:16px 14px}
h1{font-size:20px;margin:0 0 2px;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px;margin:0 0 12px}
.name{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
.row{display:flex;gap:8px;flex-wrap:wrap}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;margin:0 -14px;padding-left:14px;padding-right:14px}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 12px;text-align:left;cursor:pointer;min-width:132px}
.chip b{display:block;font-size:14px}
.chip span{font-size:12px;color:var(--muted)}
.chip.on{border-color:var(--blue);background:var(--blue-soft)}
.chip.done span{color:var(--ok);font-weight:700}
.langs{display:flex;gap:6px;margin:10px 0 2px;flex-wrap:wrap}
.lg{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer;color:var(--muted)}
.lg.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.notice{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:9px 12px;font-size:13px;margin:10px 0}
.s{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
.s.pass{border-color:var(--ok)}
.cells{display:flex;flex-wrap:wrap;gap:4px;margin:2px 0 6px}
.cell{width:46px;height:46px;display:grid;place-items:center;font-family:var(--hanzi);font-size:28px;line-height:1;
  border:1.5px solid var(--grid);border-radius:3px;
  background:
    linear-gradient(to right,transparent calc(50% - .5px),var(--grid) calc(50% - .5px),var(--grid) calc(50% + .5px),transparent calc(50% + .5px)) ,
    linear-gradient(to bottom,transparent calc(50% - .5px),var(--grid) calc(50% - .5px),var(--grid) calc(50% + .5px),transparent calc(50% + .5px));
  background-size:100% 100%;opacity:1}
.cell span{position:relative;z-index:1}
.punc{font-family:var(--hanzi);font-size:24px;align-self:end;padding-bottom:6px;color:var(--muted)}
.py{font-size:15px;color:var(--blue);font-weight:500;margin:0}
.mean{font-size:15px;margin:2px 0 10px}
.btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.b{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 6px;cursor:pointer;min-height:44px}
.b:disabled{opacity:.4;cursor:not-allowed}
.b.pri{background:var(--blue);color:#fff;border-color:var(--blue)}
:root[data-theme="dark"] .b.pri{color:#0b1220}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .b.pri{color:#0b1220}}
.b.rec{background:var(--bad);color:#fff;border-color:var(--bad)}
.b.okb{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:700}
.meter{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 4px}
.meter i{display:block;height:100%;background:var(--blue)}
.meter.good i{background:var(--ok)}
.res{font-size:13px;color:var(--muted);margin:2px 0}
.badge{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--ok-soft);color:var(--ok);font-weight:700;margin-left:6px}
.badge.self{background:var(--blue-soft);color:var(--blue)}
.card2{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.card2 h2{font-size:17px;margin:0 0 6px}
.card2 p{margin:6px 0}
a.lk{display:block;padding:11px 12px;border:1px solid var(--line);border-radius:10px;margin:8px 0;color:var(--blue);text-decoration:none;font-size:14px}
textarea{width:100%;min-height:84px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;resize:vertical}
.q{margin:14px 0}
.q p{font-weight:700;margin:0 0 8px}
.o{display:block;width:100%;text-align:left;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);margin:6px 0;cursor:pointer}
.o.right{background:var(--ok-soft);border-color:var(--ok)}
.o.wrong{background:var(--warn-soft);border-color:var(--bad)}
.stamp{border:2px solid var(--ok);border-radius:14px;padding:14px;text-align:center;margin:10px 0 14px;background:var(--ok-soft)}
.stamp.no{border-color:var(--warn);background:var(--warn-soft)}
.stamp b{font-size:26px;display:block;letter-spacing:.02em}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:15px}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--muted)}
.todo{margin:8px 0 0;padding-left:18px;font-size:14px}
nav{position:fixed;left:50%;transform:translateX(-50%);width:100%;max-width:560px;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
@media (min-width:560px){nav{max-width:532px;border:1px solid var(--line);border-bottom:0;border-radius:14px 14px 0 0}}
nav button{flex:1;border:0;background:transparent;padding:10px 4px 9px;font-size:13px;color:var(--muted);cursor:pointer;min-height:56px}
nav button.on{color:var(--blue);font-weight:700;box-shadow:inset 0 3px 0 var(--blue)}
nav button em{display:block;font-style:normal;font-size:20px;line-height:1.1}
.vr{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.vr:last-child{border-bottom:0}
.vm{display:flex;gap:8px;align-items:center;text-align:right;font-size:15px}
.hz{font-family:var(--hanzi);font-size:22px}
.py2{font-size:13px;color:var(--blue);margin-left:6px;font-family:var(--sans);font-weight:500}
.help{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0;font-size:13px}
.help summary{cursor:pointer;font-weight:700;color:var(--blue)}
.help ul{margin:8px 0 2px;padding-left:18px}
button:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.small{font-size:12px;color:var(--muted)}
.reset{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:13px;cursor:pointer;padding:8px 0}

.lbl{display:inline-block;font-size:11px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:0 8px;margin:6px 0 2px}
.cell.hit{border-color:var(--ok);background-color:var(--ok-soft)}
.cell.miss{border-color:var(--warn);border-style:dashed;background-color:var(--warn-soft)}
.grp{font-size:13px;margin:16px 2px -4px;color:var(--muted)}
.grp b{color:var(--ink)}
.py,.mean{white-space:pre-line}
.gc{color:var(--ok);font-weight:700}
.mc{color:var(--warn);font-weight:700;text-decoration:underline dotted}
.help ol{margin:8px 0 2px;padding-left:20px}
.wl>summary{cursor:pointer;font-size:16px;font-weight:800;margin-bottom:6px}
.okmark{color:var(--ok);font-weight:800;margin-left:6px}
.scr{font-size:16px;margin:4px 0 2px;color:var(--ink)}
.scr b{font-size:24px;font-weight:800}
.hrd{font-size:15px;margin:2px 0;color:var(--muted)}
.hz2{font-size:22px;font-weight:600;color:var(--ink)}
.locked{opacity:.35;pointer-events:none;user-select:none}
.help li{margin:4px 0}
.vw{padding:10px 0;border-bottom:1px dashed var(--line)}
.vw:last-child{border-bottom:0}
.vh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.vbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.vbtns .b{min-height:40px;font-size:13px;padding:6px 4px}
</style>
</head>
<body>
<div class="wrap">
  <h1>기초생활중국어 연습</h1>
  <p class="sub" id="subtitle">① 단어 → ② 본문 → ③ 퀴즈 순서로 해 보세요.</p>
  <input id="name" class="name" placeholder="이름 / Name / Tên / Нэр" autocomplete="name">
  <div id="langs" class="langs"></div>
  <div id="chips" class="chips"></div>
  <div id="view"></div>
</div>
<nav id="tabs"></nav>

<script>

<script>
/* =====================================================================
   선생님 수정 구역 / TEACHER EDIT ZONE
   - 11~20과는 빈 칸(draft)만 만들어 둔 상태입니다. 본문(sentences)·단어(vocab)·퀴즈(quiz)를 채우면 활성화됩니다.
   - 연습문제가 있는 과(짝수과)는 exercise:[...] 를 채우면 '연습' 탭이 나타납니다. 없으면 탭이 숨겨집니다.
   - 문답처럼 두 줄짜리 카드는 zh/py/뜻 안에 줄바꿈(\n)을 넣습니다. 첫 줄=질문, 둘째 줄=대답.
   - 카드 하나(문장 또는 문답 하나)가 통과 단위입니다. (g 숫자는 원래 음성 파일 번호 표시용이며 통과 계산에는 쓰지 않습니다.)
   - threshold: 자동 점수 통과 기준(%) / 초급은 낮게, 중급은 높게
   ===================================================================== */
const LESSONS = [
  {
    id:'s1', title:'샘플: 인사하기', level:'초급', threshold:60,
    sentences:[
      {zh:'你好！', py:'Nǐ hǎo!', ko:'안녕하세요!', en:'Hello!', vi:'Xin chào!', mn:'Сайн байна уу!', ja:'こんにちは！'},
      {zh:'我叫王明。', py:'Wǒ jiào Wáng Míng.', ko:'제 이름은 왕밍입니다.', en:'My name is Wang Ming.', vi:'Tên tôi là Vương Minh.', mn:'Миний нэр Ван Мин.', ja:'私は王明といいます。'},
      {zh:'你是哪国人？', py:'Nǐ shì nǎ guó rén?', ko:'어느 나라 사람이에요?', en:'Which country are you from?', vi:'Bạn là người nước nào?', mn:'Та аль улсын хүн бэ?', ja:'どこの国の人ですか？'},
      {zh:'我是韩国人。', py:'Wǒ shì Hánguó rén.', ko:'저는 한국 사람입니다.', en:"I'm Korean.", vi:'Tôi là người Hàn Quốc.', mn:'Би Солонгос хүн.', ja:'私は韓国人です。'},
      {zh:'很高兴认识你。', py:'Hěn gāoxìng rènshi nǐ.', ko:'만나서 반갑습니다.', en:'Nice to meet you.', vi:'Rất vui được làm quen với bạn.', mn:'Танилцсандаа таатай байна.', ja:'お会いできて嬉しいです。'}
    ],
    vocab:[
      {zh:'你好', py:'nǐ hǎo', ko:'안녕하세요', en:'hello', vi:'xin chào', mn:'сайн байна уу', ja:'こんにちは'},
      {zh:'谢谢', py:'xièxie', ko:'감사합니다', en:'thank you', vi:'cảm ơn', mn:'баярлалаа', ja:'ありがとう'},
      {zh:'再见', py:'zàijiàn', ko:'안녕히 가세요', en:'goodbye', vi:'tạm biệt', mn:'баяртай', ja:'さようなら'},
      {zh:'对不起', py:'duìbuqǐ', ko:'미안합니다', en:'sorry', vi:'xin lỗi', mn:'уучлаарай', ja:'ごめんなさい'},
      {zh:'名字', py:'míngzi', ko:'이름', en:'name', vi:'tên', mn:'нэр', ja:'名前'}
    ],
    culture:{
      title:'중국의 인사 문화',
      text:'중국에서는 처음 만났을 때 악수를 하는 경우가 많고, 허리를 숙여 인사하는 문화는 일반적이지 않습니다. 가까운 사이에서는 “你吃了吗？(밥 먹었어요?)”처럼 안부 삼아 식사 여부를 묻기도 합니다.',
      links:[
        {t:'중국 인사 문화 영상 찾아보기 (YouTube)', u:'https://www.youtube.com/results?search_query='+encodeURIComponent('중국어 인사 문화')},

      ],
      prompt:'오늘 알게 된 중국 인사 문화 중 인상 깊었던 점을 한 줄로 써 보세요. (한국어/영어/중국어/모국어 모두 OK)'
    },
    quiz:[
      {q:'“你好”의 뜻은?', o:['안녕하세요','감사합니다','미안합니다'], a:0},
      {q:'“我是韩国人”에서 “韩国”는 어느 나라?', o:['중국','한국','일본'], a:1},
      {q:'“很高兴认识你”는 언제 쓰나요?', o:['헤어질 때','사과할 때','처음 만났을 때'], a:2}
    ]
  },
  {
    id:'s2', title:'샘플: 식당에서 주문하기', level:'중급', threshold:70,
    sentences:[
      {zh:'我想点菜。', py:'Wǒ xiǎng diǎn cài.', ko:'주문하고 싶어요.', en:"I'd like to order.", vi:'Tôi muốn gọi món.', mn:'Би хоол захиалмаар байна.', ja:'注文したいです。'},
      {zh:'请给我一碗米饭。', py:'Qǐng gěi wǒ yì wǎn mǐfàn.', ko:'밥 한 공기 주세요.', en:'Please give me a bowl of rice.', vi:'Làm ơn cho tôi một bát cơm.', mn:'Надад нэг аяга будаа өгнө үү.', ja:'ご飯を一杯ください。'},
      {zh:'这个多少钱？', py:'Zhège duōshao qián?', ko:'이거 얼마예요?', en:'How much is this?', vi:'Cái này bao nhiêu tiền?', mn:'Энэ хэд вэ?', ja:'これはいくらですか？'},
      {zh:'不要辣的，谢谢。', py:'Bú yào là de, xièxie.', ko:'맵지 않은 걸로 주세요, 감사합니다.', en:'Nothing spicy, thank you.', vi:'Không cay, cảm ơn.', mn:'Халуун ногоогүй байг, баярлалаа.', ja:'辛くないものをお願いします、ありがとうございます。'},
      {zh:'请结账。', py:'Qǐng jiézhàng.', ko:'계산해 주세요.', en:'The bill, please.', vi:'Làm ơn tính tiền.', mn:'Тооцоо хийнэ үү.', ja:'お会計をお願いします。'}
    ],

      {zh:'辣', py:'là', ko:'맵다', en:'spicy', vi:'cay', mn:'халуун ногоотой', ja:'辛い'},
      {zh:'结账', py:'jiézhàng', ko:'계산하다', en:'pay the bill', vi:'tính tiền', mn:'тооцоо хийх', ja:'会計する'},
      {zh:'菜', py:'cài', ko:'요리', en:'dish', vi:'món ăn', mn:'хоол', ja:'料理'}
    ],
    culture:{
      title:'중국 식당 문화',
      text:'중국 식당에서는 테이블의 QR코드를 스캔해 직접 주문하는 곳이 흔합니다(扫码点餐). 또 여러 음식을 시켜 가운데에 놓고 함께 나눠 먹는 방식이 일반적입니다.',
      links:[
        {t:'扫码点餐 영상 찾아보기 (YouTube)', u:'https://www.youtube.com/results?search_query='+encodeURIComponent('중국 식당 QR 주문 扫码点餐')},
        {t:'중국 식사 예절 검색 (Google)', u:'https://www.google.com/search?q='+encodeURIComponent('중국 식사 예절 함께 나눠 먹는 문화')}
      ],
      prompt:'한국 식당과 다르다고 느낀 점, 또는 가 보고 싶은 중국 음식을 한 줄로 써 보세요.'
    },
    quiz:[
      {q:'“请结账”의 뜻은?', o:['계산해 주세요','주문할게요','물 주세요'], a:0},
      {q:'“这个多少钱？”에서 묻는 것은?', o:['맛','가격','위치'], a:1},
      {q:'“不要辣的”의 뜻은?', o:['아주 맵게','따뜻하게','맵지 않게'], a:2}
    ]

function blank(){ return {best:{},tried:{},self:{},marks:{},heard:{}}; }
function D(id){

const items=(l,k)=> k==='x' ? (l.exercise||[]) : l.sentences;
function iPass(l,k,i){ const d=D(l.id)[k]; return (d.best[i]!=null && d.best[i]>=l.threshold) || !!d.self[i]; }
function kCount(l,k){ return items(l,k).filter((_,i)=>iPass(l,k,i)).length; }
function kPass(l,k){ const arr=items(l,k); return arr.length>0 && arr.every((_,i)=>iPass(l,k,i)); }
function hasEx(l){ return (l.exercise||[]).length>0; }
function cardTotals(l){
  let p=0,t=0;
  ['p','x'].forEach(k=>{ t+=items(l,k).length; p+=kCount(l,k); });
  return [p,t];
}
function quizDone(l){ return Object.keys(D(l.id).quiz).length===l.quiz.length; }
function quizScore(l){ const d=D(l.id); return l.quiz.filter((q,i)=>d.quiz[i]===q.a).length; }
function vocabDone(l){ return !l.vocab.length || Object.keys(D(l.id).vq).length===l.vocab.length; }
function vocabScore(l){ const d=D(l.id); return l.vocab.filter((_,i)=>d.vq[i]===i).length; }
function vocabPass(l){ return vocabDone(l) && (!l.vocab.length || vocabScore(l)/l.vocab.length>=0.8); }
function lessonPass(l){ return kPass(l,'p') && (!hasEx(l) || kPass(l,'x')) && vocabPass(l) && quizDone(l); }
function tabsOf(l){

}

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const synth = window.speechSynthesis;
let zhVoice=null, voicesKnown=0;
function pickVoice(){
  if(!synth) return;
  const v=synth.getVoices(); voicesKnown=v.length;
  zhVoice = v.find(x=>/^zh[-_]CN/i.test(x.lang)) || v.find(x=>/^zh/i.test(x.lang)) || null;
}
if(synth){ pickVoice(); synth.onvoiceschanged=pickVoice; }
function speak(text, rate, onend){
  if(!synth){ return false; }
  synth.cancel();
  const u=new SpeechSynthesisUtterance(text.replace(/[“”"]/g,'').replace(/\n/g,' '));
  u.lang='zh-CN'; if(zhVoice) u.voice=zhVoice; u.rate=rate||1;
  if(onend){ u.onend=onend; u.onerror=onend; }
  synth.speak(u); return true;
}
const audioURL={}, msg={};
let cur=null, playing=null;
function playMine(key){

  playing=new Audio(audioURL[key]); playing.play().catch(()=>{});

let refAudio=null;
function stopRef(){ if(refAudio){ try{refAudio.pause();}catch(e){} refAudio=null; } }
function playRef(item, rate, onend){
  stopRef();
  if(item.au && typeof AUDIO!=='undefined' && AUDIO[item.au]){
    if(synth) synth.cancel();
    const a=new Audio(AUDIO[item.au]); a.playbackRate=(rate&&rate<0.8)?0.75:1;
    if(onend){ a.onended=onend; a.onerror=onend; }
    refAudio=a; a.play().catch(()=>{ if(onend) onend(); }); return true;
  }
  return speak(item.zh, rate, onend);
}
function norm(t){ return String(t||'').replace(/[\s\p{P}\p{S}]/gu,''); }
/* 교재 글자(a) 중 학생이 말한 글자(b)와 순서대로 맞은 글자를 true로 표시 */
function lcsMark(a,b){
  const m=a.length, n=b.length;
  const dp=Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++) dp[i][j]= a[i-1]===b[j-1] ? dp[i-1][j-1]+1 : Math.max(dp[i-1][j],dp[i][j-1]);
  const hit=new Array(m).fill(false);
  let i=m, j=n;
  while(i>0 && j>0){
    if(a[i-1]===b[j-1]){ hit[i-1]=true; i--; j--; }
    else if(dp[i-1][j]>=dp[i][j-1]) i--;
    else j--;
  }
  return hit;
}
function scoreOf(target, said){
  const a=[...norm(target)], b=[...norm(said)];
  if(!a.length) return {sc:0, hit:[]};
  const hit=lcsMark(a,b);
  const sc=Math.round(hit.filter(Boolean).length/Math.max(a.length,b.length,1)*100);
  return {sc, hit};
}

let micStream=null, micTimer=null;
/* 휴대폰은 녹음(MediaRecorder)과 중국어 인식(SpeechRecognition)이 마이크를 동시에 쓰지 못합니다.
   PC Chrome은 공유가 되고, 폰은 녹음만 되고 평가는 빈 결과가 됩니다. */
const isPhone=/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
function recMime(){
  if(typeof MediaRecorder==='undefined') return '';
  const ts=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/aac','audio/ogg;codecs=opus'];
  return ts.find(t=>MediaRecorder.isTypeSupported(t))||'';
}
async function getMic(){
  clearTimeout(micTimer);
  if(micStream && micStream.getAudioTracks().some(t=>t.readyState==='live')) return micStream;
  micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
  return micStream;
}
function releaseMic(){ clearTimeout(micTimer); if(micStream){ try{micStream.getTracks().forEach(t=>t.stop());}catch(e){} micStream=null; } }
function armMicIdle(){
  clearTimeout(micTimer);
  /* 폰에 마이크를 붙잡아 두면 다음 말하기의 음성 인식이 침묵만 듣습니다 */
  if(isPhone) releaseMic();
  else micTimer=setTimeout(releaseMic,120000);
}
document.addEventListener('visibilitychange',()=>{ if(document.hidden) releaseMic(); });
function attachSR(c){
  if(!SR) return;
  const bind=cont=>{
    const rec=new SR();
    rec.lang='zh-CN';
    rec.interimResults=true;
    rec.continuous=cont;
    rec.maxAlternatives=3;
    rec.onresult=ev=>{
      c.srErr='';
      for(let i=ev.resultIndex;i<ev.results.length;i++){
        const r=ev.results[i];
        for(let q=0;q<r.length;q++) c.texts.push(r[q].transcript);
      }
      const segs=[];
      for(let i=0;i<ev.results.length;i++) segs.push(ev.results[i][0].transcript);
      c.full=segs.join('');
    };
    rec.onerror=ev=>{
      c.srErr=ev.error||'';
      if(ev.error==='language-not-supported' && rec.lang==='zh-CN'){
        try{ rec.lang='cmn-Hans-CN'; }catch(e){}
      }
    };
    /* 폰은 잠깐 쉬면 인식이 끝나 버립니다. 끝내기 전까지 다시 켭니다 */
    rec.onend=()=>{
      if(c.stopping||c.final) return;
      try{ rec.start(); }catch(e){}
    };
    rec.start();
    c.sr=rec;
  };
  try{ bind(true); }
  catch(e){
    try{ bind(false); }
    catch(e2){ c.sr=null; }
  }
}
async function startRecorder(c){
  try{
    c.stream=await getMic();
    if(c.stopping||c.final) return;
    const mime=recMime();
    c.mr=mime?new MediaRecorder(c.stream,{mimeType:mime}):new MediaRecorder(c.stream);
    c.mr.ondataavailable=e=>{ if(e.data && e.data.size) c.chunks.push(e.data); };
    c.mr.start(250);
  }catch(e){ c.mr=null; }
}
async function startRec(k,i){
  if(cur) return;
  const l=lesson(), key=l.id+':'+k+':'+i, s=items(l,k)[i];
  const pair=String(s.zh).includes('\n');
  if(synth) synth.cancel();
  stopRef();
  const c={key,k,i,lid:l.id,chunks:[],texts:[],full:'',target:s.zh};
  cur=c; msg[key]=''; renderCard(k,i);
  /* 클릭과 같은 순간에 인식을 시작해야 아이폰이 허용합니다. await 뒤에 시작하면 평가가 비습니다. */
  if(isPhone) releaseMic();
  attachSR(c);
  /* 인식을 먼저 켠 다음 녹음을 켭니다. 폰에서 녹음을 먼저 켜면 평가가 비고, 녹음을 빼면 내 소리·비교하기가 비활성화됩니다. */
  const recP=startRecorder(c);
  if(!isPhone) await recP;
  if(!c.mr && !c.sr){
    cur=null;
    msg[key]='마이크를 사용할 수 없어요. 브라우저의 마이크 허용을 확인하거나, 링크를 Chrome/Safari에서 직접 열어 보세요.';
    renderCard(k,i); return;
  }
  c.timer=setTimeout(stopRec, pair?15000:9000);
}
function stopRec(){
  if(!cur||cur.stopping) return;
  const c=cur; c.stopping=true; clearTimeout(c.timer);
  try{ c.sr && c.sr.stop(); }catch(e){}
  try{ if(c.mr && c.mr.state!=='inactive') c.mr.stop(); }catch(e){}
  setTimeout(()=>finalize(c), isPhone?1800:1000);
  renderCard(c.k,c.i);
}
/* 음성 인식이 허용되지 않았을 때 카드 아래에 나오는 안내 (선택한 언어) */
const MSG_NOT_ALLOWED={
  ko:'마이크 사용이 허용되지 않았어요. 다시 시도해 보세요.',
  en:'Microphone use was not allowed. Please try again.',
  vi:'Chưa được cho phép sử dụng micro. Vui lòng thử lại.',
  mn:'Микрофоныг ашиглахыг зөвшөөрөөгүй байна. Дахин оролдоно уу.',
  ja:'マイクの使用が許可されていません。もう一度お試しください。'
};
function srFailMsg(err){
  if(err==='not-allowed') return MSG_NOT_ALLOWED[S.lang]||MSG_NOT_ALLOWED.ko;
  if(err==='language-not-supported') return '이 휴대폰은 중국어 음성 인식을 지원하지 않아요. Chrome을 쓰거나, 설정에서 중국어(Chinese)를 추가해 보세요.';
  if(err==='network' || err==='service-not-allowed') return '음성 인식에 연결하지 못했어요. 카카오톡 등 앱 안이 아니라 Chrome 또는 Safari로 “브라우저에서 열기” 해 주세요.';
  return '인식된 말이 없어요. Chrome/Safari에서 열고, 말하기를 누른 뒤 바로 말해 보세요.';
}
function finalize(c){
  if(c.final) return; c.final=true; if(cur===c) cur=null;
  armMicIdle();
  if(c.chunks.length){
    if(audioURL[c.key]) URL.revokeObjectURL(audioURL[c.key]);
    audioURL[c.key]=URL.createObjectURL(new Blob(c.chunks,{type:(c.mr&&c.mr.mimeType)||'audio/webm'}));
  }
  const d=D(c.lid)[c.k]; d.tried[c.i]=true;
  if(SR){
    const cands=c.texts.slice(); if(c.full) cands.push(c.full);
    if(cands.length){
      let best=-1, bt='', bh=[];
      cands.forEach(t=>{ const r=scoreOf(c.target,t); if(r.sc>best){ best=r.sc; bt=t; bh=r.hit; } });
      /* 가장 좋았던 시도의 점수·글자 표시·인식된 말을 함께 저장 */
      if(d.best[c.i]==null || best>d.best[c.i]){
        d.best[c.i]=best; d.marks[c.i]=bh.map(x=>x?'1':'0').join(''); d.heard[c.i]=bt;
      }
      msg[c.key]='';
    }else{
      msg[c.key]=srFailMsg(c.srErr);
    }
  }else{
    msg[c.key]='이 브라우저는 자동 점수를 지원하지 않아요. 원어민 소리와 비교해 듣고, 아래 “스스로 확인”을 눌러 주세요.';
  }
  save();
  if(lesson().id===c.lid){ renderCard(c.k,c.i); renderChips(); }
}

const isPunc=ch=>/[\p{P}\p{S}\s]/u.test(ch);
/* marks: 글자별 '1'(잘 들림) / '0'(다시 들어 보기) 문자열. 줄바꿈이 있으면 질문/대답 두 줄로 보여 줍니다 */
function cells(zh, marks){
  let idx=0;
  const lines=String(zh).split('\n'), pair=lines.length>1;
  return lines.map((line,li)=>{
    const lab=pair?'<span class="lbl">'+(li===0?'질문':'대답')+'</span>':'';
    const cs=[...line].map(ch=>{
      if(isPunc(ch)) return '<span class="punc">'+esc(ch)+'</span>';
      const m=marks?marks[idx]:null; idx++;
      const cls= m==='1' ? ' hit' : (m==='0' ? ' miss' : '');
      return '<div class="cell'+cls+'"><span>'+esc(ch)+'</span></div>';
    }).join('');
    return lab+'<div class="cells" lang="zh-CN">'+cs+'</div>';
  }).join('');
}
function markedHTML(zh, marks){
  let idx=0;
  return [...String(zh)].map(ch=>{
    if(ch==='\n') return '<br>';
    if(isPunc(ch)) return esc(ch);
    const m=marks?marks[idx]:null; idx++;
    return m==='1' ? '<span class="gc">'+esc(ch)+'</span>' : (m==='0' ? '<span class="mc">'+esc(ch)+'</span>' : esc(ch));
  }).join('');
}
function charLists(zh, marks){
  const good=[], weak=[]; let idx=0;
  [...String(zh)].forEach(ch=>{
    if(isPunc(ch)) return;
    const m=marks?marks[idx]:null; idx++;
    const arr= m==='1' ? good : (m==='0' ? weak : null);
    if(arr && !arr.includes(ch)) arr.push(ch);
  });
  return {good:good.join(' '), weak:weak.join(' ')};
}
function cardHTML(l,k,i){
  const s=items(l,k)[i], key=l.id+':'+k+':'+i, d=D(l.id)[k], best=d.best[i], pass=iPass(l,k,i);
  const recording=cur && cur.key===key && !cur.stopping;
  const has=!!audioURL[key];
  const autoOk = best!=null && best>=l.threshold;
  const meaning=s[S.lang]||s.ko;
  let res='';
  if(best!=null){
    res='<div class="meter '+(autoOk?'good':'')+'"><i style="width:'+best+'%"></i></div>'+
        '<p class="scr">자동 점수 <b>'+best+'점</b> <span class="small">(통과 기준 '+l.threshold+'점)</span></p>'+
        (d.heard[i]?'<p class="hrd">인식된 말: <span class="hz2" lang="zh-CN">'+esc(d.heard[i])+'</span></p>':'');
    if(d.marks[i] && d.marks[i].includes('1')) res+='<p class="res">초록 칸은 잘 들린 글자, 점선 칸은 다시 들어 볼 글자예요.</p>';
  }
  const hint=(best!=null && best<l.threshold)?'<p class="res">잘 들린 부분도 많이 있어요. 점선 칸의 글자를 원어민 소리와 비교해 다시 들어 보세요. 선생님과 함께 해 봐도 좋아요.</p>':'';
  const m=msg[key]?'<p class="res" style="color:var(--warn)">'+esc(msg[key])+'</p>':'';
  const at='data-k="'+k+'" data-i="'+i+'"';
  return '<div class="s '+(pass?'pass':'')+'" id="c'+k+i+'">'+
    cells(s.zh, d.marks[i])+
    '<p class="py">'+esc(s.py)+(pass?(autoOk?'<span class="badge">통과</span>':'<span class="badge self">스스로 통과</span>'):'')+'</p>'+
    '<p class="mean">'+esc(meaning)+'</p>'+
    '<div class="btns">'+
      '<button class="b" data-act="say" '+at+' data-r="1">🔊 듣기</button>'+
      '<button class="b" data-act="say" '+at+' data-r="0.6">🐢 천천히</button>'+
      (recording ? '<button class="b rec" data-act="stop" '+at+'>■ 끝내기</button>'
                 : '<button class="b pri" data-act="rec" '+at+'>🎙 말하기</button>')+
      '<button class="b" data-act="mine" '+at+(has?'':' disabled')+'>▶ 내 소리</button>'+
      '<button class="b" data-act="cmp" '+at+(has?'':' disabled')+'>⇄ 비교하기</button>'+
      '<button class="b '+(d.self[i]?'okb':'')+'" data-act="self" '+at+(d.tried[i]?'':' disabled')+'>'+(d.self[i]?'✔ 확인함':'☐ 셀프확인')+'</button>'+
    '</div>'+res+hint+m+
  '</div>';
}
function renderCard(k,i){
  const l=lesson();
  const el=$('c'+k+i); if(el) el.outerHTML=cardHTML(l,k,i);
}
function listHTML(l,k){
  return items(l,k).map((_,i)=>cardHTML(l,k,i)).join('');
}

function renderChips(){
  const st=$('subtitle'); if(st) st.textContent=ORDER[S.lang]||ORDER.ko;
  $('chips').innerHTML=LESSONS.map(l=>{

  }).join('');
  $('langs').innerHTML=Object.keys(LANGS).map(k=>'<button class="lg '+(S.lang===k?'on':'')+'" data-act="lang" data-id="'+k+'">'+LANGS[k]+'</button>').join('');

function renderWord(i){ const l=lesson(), el=$('vw'+i); if(el && l.vocab[i]) el.outerHTML=vwHTML(l,i); }
async function startWord(i){
  if(wcur||cur) return;

  if(synth) synth.cancel();
  stopRef();
  const c={key,i,lid:l.id,chunks:[]};
  wcur=c; wmsg[key]=''; renderWord(i);
  try{
    c.stream=await getMic();
    const mime=recMime();
    c.mr=mime?new MediaRecorder(c.stream,{mimeType:mime}):new MediaRecorder(c.stream);
    c.mr.ondataavailable=e=>{ if(e.data && e.data.size) c.chunks.push(e.data); };
    c.mr.onstop=()=>finishWord(c);
    c.mr.start(250);
  }catch(e){
    wcur=null; wmsg[key]=VT().micFail;
    /* 마이크를 쓸 수 없는 폰에서도 막히지 않도록 이 단어는 말하기 완료로 처리 (선생님이 대면에서 확인) */
    D(l.id).wdone[i]=true; save();
    renderWord(i); updGate(); return;
  }
  c.timer=setTimeout(stopWord,4000);
}
function stopWord(){
  const c=wcur; if(!c||c.stopping) return;
  c.stopping=true; clearTimeout(c.timer);
  try{ if(c.mr && c.mr.state!=='inactive') c.mr.stop(); else finishWord(c); }catch(e){ finishWord(c); }
  if(lesson().id===c.lid) renderWord(c.i);
}
function finishWord(c){
  if(c.done) return; c.done=true; if(wcur===c) wcur=null;
  armMicIdle();
  if(c.chunks.length){
    if(audioURL[c.key]) URL.revokeObjectURL(audioURL[c.key]);
    audioURL[c.key]=URL.createObjectURL(new Blob(c.chunks,{type:(c.mr&&c.mr.mimeType)||'audio/webm'}));
    D(c.lid).wdone[c.i]=true; save();
  }
  if(lesson().id===c.lid && S.tab==='vocab'){ renderWord(c.i); updGate(); }
}
function renderTabs(){
  const T=tabsOf(lesson());
  if(!T.some(t=>t[0]===S.tab)) S.tab='vocab';
  $('tabs').innerHTML=T.map(t=>'<button class="'+(S.tab===t[0]?'on':'')+'" data-act="tab" data-id="'+t[0]+'"><em>'+t[1]+'</em>'+t[2]+'</button>').join('');
}
function drillView(l,k){
  let h='';
  const arr=items(l,k);
  if(!arr.length) return '<div class="card2"><h2>'+KLABEL[k]+' 준비 중</h2><p>곧 등록돼요. 먼저 <b>단어 탭</b>에서 연습하세요.</p></div>';
  if(synth && voicesKnown>0 && !zhVoice) h+='<div class="notice">이 휴대폰에 중국어 음성이 없을 수 있어요. 소리가 안 나면 휴대폰 설정에서 중국어(Chinese) 음성을 설치해 주세요.</div>';
  if(!SR) h+='<div class="notice">이 브라우저는 자동 점수를 지원하지 않아요. 녹음 후 원어민 소리와 비교하고 “스스로 확인”으로 통과하세요. (자동 점수는 휴대폰 Chrome에서 가장 잘 됩니다.)</div>';
  else if(isPhone) h+='<div class="notice">휴대폰에서는 말하기 점수를 위해 음성 인식을 먼저 씁니다. 카카오톡 등이 아니라 Chrome(안드로이드) 또는 Safari(아이폰)로 열어 주세요. 내 소리·비교하기 파일은 PC에서 함께 저장됩니다.</div>';
  h+= k==='p' ? '' : '<p class="sub">① 듣기 → ② 말하기 → ③ 비교하기 순서로 해 보세요. 점수가 기준 이상이거나 스스로 확인하면 통과입니다.'+(arr.some(s=>String(s.zh).includes('\n'))?' 질문과 대답을 이어서 말해 보세요.':'')+'</p>';
  h+='<details class="help"><summary>마이크 허용 창이 자꾸 뜨나요?</summary><ul><li>창이 뜨면 “이번에만”이 아니라 “허용”(방문 중 허용)을 고르세요.</li><li>안드로이드 Chrome: 주소창 왼쪽 아이콘 → 권한 → 마이크 → 허용</li><li>아이폰 Safari: 주소창 aA → 웹사이트 설정 → 마이크 → 허용</li><li>카카오톡 같은 앱 안에서 열면 허용이 저장되지 않을 수 있어요. “다른 브라우저로 열기”로 Chrome이나 Safari에서 여세요.</li></ul></details>';
  return h+(k==='p'?textHelpHTML():'')+listHTML(l,k);
}
function renderView(){
  const l=lesson(), d=D(l.id); let h='';
  if(!l.sentences.length && !l.vocab.length){
    $('view').innerHTML='<div class="card2"><h2>'+esc(l.title)+' 준비 중</h2><p>본문과 단어가 아직 등록되지 않았어요. 선생님이 등록하면 여기에 나타납니다.</p></div>';
    return;
  }
  if(S.tab==='quiz' && !l.quiz.length){ $('view').innerHTML='<div class="card2"><h2>퀴즈 준비 중</h2><p>곧 등록돼요. 먼저 단어 탭에서 연습하세요.</p></div>'; return; }
  if(S.tab==='practice') h+=drillView(l,'p');
  if(S.tab==='exercise') h+=drillView(l,'x');
  if(S.tab==='vocab'){
    const n=l.vocab.length, k=Math.min(4,n), T=VT();
    if(!n){ $('view').innerHTML='<div class="card2"><h2>단어 준비 중</h2><p>곧 등록돼요.</p></div>'; return; }
    const optsOf=i=>{ const o=[]; for(let j=0;j<k;j++) o.push((i+j)%n); const r=(i*3+1)%k; return o.slice(r).concat(o.slice(0,r)); };
    h+=vocabHelpHTML();
    const open=quizOpen(l), G=VG();
    h+='<details class="card2 wl" id="wl"'+(open?'':' open')+'><summary>'+esc(T.listHead(n))+' <span class="small" id="wprog">'+esc(G.progress(wordsDoneCount(l),n))+'</span></summary>'+l.vocab.map((w,i)=>vwHTML(l,i)).join('')+'</details>';
    if(!open){
      h+='<div class="card2"><h2>'+esc(T.quizHead)+'</h2>'+gateHTML(l)+'</div>';
    }else{
      h+='<div class="card2" id="vquiz"><h2>'+esc(T.quizHead)+'</h2>'+(T.quizNote?'<p class="small">'+esc(T.quizNote)+'</p>':'');
      l.vocab.forEach((w,i)=>{
        const a=d.vq[i];
        h+='<div class="q"><p>'+(i+1)+'. <span class="hz" lang="zh-CN">'+esc(w.zh)+'</span><span class="py2">'+esc(w.py)+'</span></p>'+optsOf(i).map(oi=>{
          let cls=''; if(a!=null){ if(oi===i) cls='right'; else if(oi===a) cls='wrong'; }
          return '<button class="o '+cls+'" data-act="vans" data-q="'+i+'" data-o="'+oi+'">'+esc(l.vocab[oi].ko)+'</button>';
        }).join('')+'</div>';
      });
      if(vocabDone(l)) h+='<p><b>'+esc(T.result(vocabScore(l),n,vocabPass(l)))+'</b></p><button class="reset" data-act="vreset">'+esc(T.retry)+'</button>';
      h+='</div>';
    }
  }
  if(S.tab==='quiz'){
    h+=quizGuideHTML();
    h+='<div class="card2"><h2>확인 문제 ('+l.quiz.length+'문제)</h2>';
    l.quiz.forEach((q,qi)=>{
      const a=d.quiz[qi];
      h+='<div class="q"><p>'+(qi+1)+'. '+esc(q.q)+'</p>'+q.o.map((o,oi)=>{
        let cls=''; if(a!=null){ if(oi===q.a) cls='right'; else if(oi===a) cls='wrong'; }
        return '<button class="o '+cls+'" data-act="ans" data-q="'+qi+'" data-o="'+oi+'">'+esc(o)+'</button>';
      }).join('')+'</div>';
    });
    if(quizDone(l)) h+='<p><b>결과: '+quizScore(l)+' / '+l.quiz.length+'</b></p><button class="reset" data-act="quizreset">문제 다시 풀기</button>';
    h+='</div>';
  }
  if(S.tab==='card'){
    const ok=lessonPass(l);
    const kinds=['p'].concat(hasEx(l)?['x']:[]);
    const todo=[], helpItems=[];
    let rows='';
    kinds.forEach(k=>{
      const dk=d[k], arr=items(l,k);
      const selfOnly=arr.filter((_,i)=>iPass(l,k,i) && !(dk.best[i]>=l.threshold)).length;
      rows+='<div class="kv"><span>'+KLABEL[k]+'</span><span>'+kCount(l,k)+' / '+arr.length+' 통과'+(selfOnly?' (스스로 통과 '+selfOnly+')':'')+'</span></div>';
      arr.forEach((s,i)=>{
        const b=dk.best[i];
        if(!iPass(l,k,i)) todo.push(KLABEL[k]+': “'+String(s.zh).replace(/\n/g,' ')+'” '+(b!=null?'(최고 '+b+'점, 기준 '+l.threshold+'점)':'(아직 안 함)'));
        if(b!=null && b<l.threshold) helpItems.push({k,i,s,b});
        else if(b==null && dk.self[i]) helpItems.push({k,i,s,b:null});
      });
    });
    if(!l.sentences.length) todo.push('본문은 준비 중이에요');
    if(!vocabPass(l)) todo.push(vocabDone(l)?'단어 뜻 맞히기 80% 이상 필요 (다시 풀기)':'단어 뜻 맞히기를 끝내세요');
    if(!quizDone(l)) todo.push('퀴즈를 모두 풀어 주세요');
    else l.quiz.forEach((q,qi)=>{ if(d.quiz[qi]!==q.a) todo.push('퀴즈 '+(qi+1)+'번 다시 보기'); });
    const helpHTML=helpItems.length?
      '<p style="margin:12px 0 2px"><b>선생님과 함께 볼 문장</b></p><ul class="todo">'+helpItems.map(o=>{
        const mk=D(l.id)[o.k].marks[o.i], cl=charLists(o.s.zh, mk);
        return '<li>['+KLABEL[o.k]+'] <span lang="zh-CN">'+markedHTML(o.s.zh, mk)+'</span> '+(o.b!=null?'(최고 '+o.b+'점)':'(자동 점수 없이 스스로 확인함)')+
          (cl.good||cl.weak?'<br><span class="small">'+(cl.good?'잘 들린 글자: '+esc(cl.good):'')+(cl.good&&cl.weak?' · ':'')+(cl.weak?'다시 들어 볼 글자: '+esc(cl.weak):'')+'</span>':'')+'</li>';
      }).join('')+'</ul><p class="small">표시는 음성 인식 결과를 바탕으로 한 참고용이에요. 선생님이 직접 들어 보고 확인합니다.</p>':'';
    h+=submitGuideHTML()+
      '<div class="card2"><div class="stamp '+(ok?'':'no')+'"><b>'+(ok?'통과 PASS ✔':'진행 중')+'</b><span>'+esc(l.title)+(l.level?' ('+esc(l.level)+')':'')+'</span></div>'+
      '<div class="kv"><span>이름</span><span>'+esc(S.name||'(이름을 위에 입력하세요)')+'</span></div>'+
      '<div class="kv"><span>단어</span><span>'+(l.vocab.length?(vocabDone(l)?vocabScore(l)+' / '+l.vocab.length:'미완료'):'-')+'</span></div>'+
      rows+
      '<div class="kv"><span>퀴즈</span><span>'+(l.quiz.length?(quizDone(l)?quizScore(l)+' / '+l.quiz.length:'미완료'):'-')+'</span></div>'+
      '<div class="kv"><span>일시</span><span>'+esc(new Date().toLocaleString('ko-KR'))+'</span></div>'+
      (ok?'':'<p style="margin:12px 0 2px"><b>부족한 점</b></p><ul class="todo">'+todo.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>')+
      helpHTML+
      '</div>';
  }
  $('view').innerHTML=h;
}
function render(){ renderTabs(); renderChips(); renderView(); }

/* ----- 이벤트 ----- */
$('name').value=S.name||'';
$('name').addEventListener('input',e=>{ S.name=e.target.value; save(); });
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b||b.disabled) return;
  const a=b.dataset.act, l=lesson(), i=+b.dataset.i, k=b.dataset.k, d=D(l.id);
  if(a==='tab'){ if(wcur) stopWord(); S.tab=b.dataset.id; if(S.tab!=='practice' && S.tab!=='exercise') releaseMic(); save(); render(); window.scrollTo(0,0); }
  else if(a==='lesson'){ if(cur) stopRec(); if(wcur) stopWord(); S.lesson=b.dataset.id; save(); render(); }
  else if(a==='lang'){ S.lang=b.dataset.id; save(); renderChips(); renderView(); }
  else if(a==='say'){ playRef(items(l,k)[i], +b.dataset.r); }
  else if(a==='rec'){ startRec(k,i); }
  else if(a==='stop'){ stopRec(); }
  else if(a==='mine'){ playMine(l.id+':'+k+':'+i); }
  else if(a==='cmp'){ const key=l.id+':'+k+':'+i; if(!playRef(items(l,k)[i],0.9,()=>setTimeout(()=>playMine(key),300))) playMine(key); }
  else if(a==='self'){ d[k].self[i]=!d[k].self[i]; save(); renderCard(k,i); renderChips(); }
  else if(a==='ans'){ const q=+b.dataset.q; if(d.quiz[q]==null){ d.quiz[q]=+b.dataset.o; save(); renderView(); renderChips(); } }
  else if(a==='quizreset'){ d.quiz={}; save(); renderView(); renderChips(); }
  else if(a==='vsay'){ playRef(l.vocab[i], 1); }
  else if(a==='qopen'){ if(wordsDoneCount(l)>=l.vocab.length){ d.qopen=true; save(); renderView(); const q=$('vquiz'); if(q) q.scrollIntoView({block:'start'}); } }
  else if(a==='wrec'){ startWord(i); }
  else if(a==='wstop'){ stopWord(); }
  else if(a==='wmine'){ playMine(l.id+':v:'+i); }
  else if(a==='wcmp'){ const key=l.id+':v:'+i; if(!playRef(l.vocab[i],0.9,()=>setTimeout(()=>playMine(key),300))) playMine(key); }
  else if(a==='vans'){ const q=+b.dataset.q; if(d.vq[q]==null){ d.vq[q]=+b.dataset.o; save(); renderView(); renderChips(); } }
  else if(a==='vreset'){ d.vq={}; save(); renderView(); renderChips(); }
});
render();
</script>
